<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#ffffff">

    <title>비상전화</title>

    <!-- PWA 설정 -->
    <link rel="manifest"
          href="./manifest.json">

    <link rel="apple-touch-icon"
          href="./icons/icon-192.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            background: #f2f2f2;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {

            max-width: 600px;

            margin: auto;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }

        .emergency-button {

            height: 220px;

            border: none;

            border-radius: 20px;

            background: white;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.15);

            font-size: 35px;

            font-weight: bold;

            cursor: pointer;
        }

        .number {

            display: block;

            margin-top: 15px;

            font-size: 45px;
        }

        .emergency-button:active {

            transform: scale(0.96);
        }

    </style>

</head>


<body>

    <h1>🚨 비상전화</h1>


    <div class="container">

        <button
            class="emergency-button"

            onclick="location.href='tel:112'">

            🚓 경찰서

            <span class="number">
                112
            </span>

        </button>


        <button
            class="emergency-button"

            onclick="location.href='tel:119'">

            🚒 소방서

            <span class="number">
                119
            </span>

        </button>

    </div>


    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register(
                            "./service-worker.js"
                        );

                }
            );

        }

    </script>

</body>

</html>
