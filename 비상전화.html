<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>비상전화</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: auto;
        }

        .emergency-button {
            height: 200px;

            border: none;
            border-radius: 20px;

            font-size: 40px;
            font-weight: bold;

            cursor: pointer;

            background-color: white;

            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }

        .emergency-button:active {
            transform: scale(0.97);
        }

        .number {
            display: block;
            font-size: 30px;
            margin-top: 15px;
        }

    </style>
</head>

<body>

    <h1>비상전화</h1>

    <div class="container">

        <button class="emergency-button"
                onclick="location.href='tel:112'">

            🚓 경찰서

            <span class="number">
                112
            </span>

        </button>


        <button class="emergency-button"
                onclick="location.href='tel:119'">

            🚒 소방서

            <span class="number">
                119
            </span>

        </button>

    </div>

</body>
</html>
